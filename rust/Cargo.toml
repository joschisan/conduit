[package]
name = "conduit"
version = "0.7.0"
edition = "2024"

[package.metadata.cargo-machete]
# Not imported: listed only to turn on the "all" feature netwatch needs (see above).
ignored = ["socket2"]

[dependencies]
bitcoin = "0.32.5"
fedimint-bip39 = "0.12.0-rc.0"
fedimint-client = "0.12.0-rc.0"
fedimint-client-module = "0.12.0-rc.0"
fedimint-connectors = "0.12.0-rc.0"
fedimint-core = "0.12.0-rc.0"
fedimint-eventlog = "0.12.0-rc.0"
fedimint-fountain = "0.12.0-rc.0"
fedimint-lnurl = "0.12.0-rc.0"
fedimint-lnv2-client = "0.12.0-rc.0"
fedimint-meta-client = "0.12.0-rc.0"
fedimint-mint-client = "0.12.0-rc.0"
fedimint-mintv2-client = "0.12.0-rc.0"
fedimint-rocksdb = "0.12.0-rc.0"
fedimint-wallet-client = "0.12.0-rc.0"
fedimint-walletv2-client = "0.12.0-rc.0"
flutter_rust_bridge = "=2.10.0"
futures-util = "0.3.30"
lightning-invoice = { version = "0.33.2", features = ["std"] }
regex = "1"
reqwest = { version = "0.12.28", features = ["rustls-tls", "json"], default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
# netwatch 0.5 (via iroh) needs socket2 0.5's "all" feature, which nothing else enables anymore
socket2 = { version = "0.5.9", features = ["all"] }
tokio = "1.49"
url = "2"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(frb_expand)'] }

[profile.dev.package]
librocksdb-sys = { opt-level = 3 }
secp256k1 = { opt-level = 3 }
secp256k1-sys = { opt-level = 3 }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = false
debug = "line-tables-only"

[profile.release.package]
librocksdb-sys = { opt-level = 3 }
secp256k1 = { opt-level = 3 }
secp256k1-sys = { opt-level = 3 }
