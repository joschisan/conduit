[package]
name = "conduit"
version = "0.7.0"
edition = "2024"

[package.metadata.cargo-machete]
# Not imported: listed only to turn on the "all" feature netwatch needs (see above).
ignored = ["socket2"]

[dependencies]
bitcoin = "0.32.5"
fedimint-bip39 = { git = "https://github.com/joschisan/fedimint", rev = "cc49065ca86" }
fedimint-client = { git = "https://github.com/joschisan/fedimint", rev = "cc49065ca86" }
fedimint-client-module = { git = "https://github.com/joschisan/fedimint", rev = "cc49065ca86" }
fedimint-connectors = { git = "https://github.com/joschisan/fedimint", rev = "cc49065ca86" }
fedimint-core = { git = "https://github.com/joschisan/fedimint", rev = "cc49065ca86" }
fedimint-derive-secret = { git = "https://github.com/joschisan/fedimint", rev = "cc49065ca86" }
fedimint-eventlog = { git = "https://github.com/joschisan/fedimint", rev = "cc49065ca86" }
fedimint-fountain = { git = "https://github.com/joschisan/fedimint", rev = "cc49065ca86" }
fedimint-lnurl = { git = "https://github.com/joschisan/fedimint", rev = "cc49065ca86" }
fedimint-lnv2-client = { git = "https://github.com/joschisan/fedimint", rev = "cc49065ca86" }
fedimint-meta-client = { git = "https://github.com/joschisan/fedimint", rev = "cc49065ca86" }
fedimint-mint-client = { git = "https://github.com/joschisan/fedimint", rev = "cc49065ca86" }
fedimint-mintv2-client = { git = "https://github.com/joschisan/fedimint", rev = "cc49065ca86" }
fedimint-rocksdb = { git = "https://github.com/joschisan/fedimint", rev = "cc49065ca86" }
fedimint-wallet-client = { git = "https://github.com/joschisan/fedimint", rev = "cc49065ca86" }
fedimint-walletv2-client = { git = "https://github.com/joschisan/fedimint", rev = "cc49065ca86" }
flutter_rust_bridge = "=2.10.0"
futures-util = "0.3.30"
lightning-invoice = { version = "0.33.2", features = ["std"] }
regex = "1"
reqwest = { version = "0.12.28", features = ["rustls-tls", "json"], default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
# netwatch 0.5 (via iroh) needs socket2 0.5's "all" feature, which nothing else enables anymore
socket2 = { version = "0.5.9", features = ["all"] }
tokio = "1.49"
url = "2"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(frb_expand)'] }

[profile.dev.package]
librocksdb-sys = { opt-level = 3 }
secp256k1 = { opt-level = 3 }
secp256k1-sys = { opt-level = 3 }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = false
debug = "line-tables-only"

[profile.release.package]
librocksdb-sys = { opt-level = 3 }
secp256k1 = { opt-level = 3 }
secp256k1-sys = { opt-level = 3 }
